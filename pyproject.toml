[project]
name = "balance-system"
version = "0.1.0"
description = ""
authors = [{ name = "Airenik Melkonyan", email = "melkonyanair@outlook.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=5.1.1,<6",
    "djangorestframework>=3.15.2,<4",
    "python-dotenv>=1.0.1,<2",
    "djoser>=2.2.3,<3",
    "drf-yasg>=1.21.7,<2",
    "django-prometheus>=2.3.1,<3",
    "psycopg2>=2.9.9,<3",
    "celery>=5.4.0,<6",
    "redis>=5.1.1,<6",
]

[dependency-groups]
dev = [
    "black>=24.8.0,<25",
    "isort>=5.13.2,<6",
    "flake8>=7.1.1,<8",
    "django-stubs>=5.1.0,<6",
    "django-extensions>=3.2.3,<4",
    "ipython>=8.28.0,<9",
    "django-debug-toolbar>=4.4.6,<5",
]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
skip = "migrations"
