[project]
name = "balance-system"
version = "0.1.0"
description = ""
authors = [{ name = "Airenik Melkonyan", email = "melkonyanair@outlook.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>=6.1.1,<7",
    "django-modern-rest[pydantic,jwt,openapi]>=0.15.0",
    "celery>=5.6.3,<6",
    "redis>=8.1.0,<9",
    "psycopg2-binary>=2.9.12",
    "django-split-settings>=1.3.2",
]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "celery-types>=0.26.0",
    "django-stubs>=6.1.0,<7",
    "django-extensions>=4.1,<5",
    "ipython>=9.17.1,<10",
    "django-debug-toolbar>=8.0.0,<9",
    "pre-commit>=4.6.2",
]

[tool.uv]
package = false

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "cdk.out",
    ".vscode",
    ".pytest_cache",
    ".build",
    ".mypy_cache",
    ".github",
    "migrations",
] # Exclude a variety of commonly ignored directories.

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "C", # flake8-comprehensions
    "B", # flake8-bugbear
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]
ignore = ["E203", "E266", "E501", "W191"]

[tool.ruff.lint.per-file-ignores]
"balance-system/config/settings/**/*.py" = ["E402", "F403", "F405", "F821"]

[tool.ruff.format]
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["apps", "config", "services"]
known-third-party = ["celery", "dmr", "pydantic", "split_settings"]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 10.
max-complexity = 10
